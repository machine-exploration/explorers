[project]
name = "machine-explorers"
version = "0.0.1"
description = "Infrastructure for understanding multi-agent AI."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
verifiers = [
  "verifiers @ git+https://github.com/machine-exploration/verifiers@e66ec52966327e79011f4c3bb34a0f9817ce32b8",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explorers"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the 4070 machine and a running vLLM server"]
addopts = "-m 'not gpu'"
