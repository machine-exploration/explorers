[project]
name = "explorers"
version = "0.2.0.dev0"
description = "Read, write and trace the internal computation of neural networks."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "xarray>=2024.1",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "transformers>=4.40"]
populations = ["pydantic>=2.7", "pyyaml>=6"]
verifiers = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "verifiers @ git+https://github.com/machine-exploration/verifiers@e66ec52966327e79011f4c3bb34a0f9817ce32b8",
]

[dependency-groups]
dev = ["pytest>=8", "explorers[torch,populations]", "tokenizers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorers"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
explorers = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the 4070 machine and a running vLLM server"]
addopts = "-m 'not gpu' --import-mode=importlib"
