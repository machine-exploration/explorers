[project]
name = "explorers-populations"
version = "0.1.0.dev0"
description = "Populations on explorers: scenarios, a multi-agent runtime, episodes, labels and detectors."
requires-python = ">=3.11"
dependencies = [
  "explorers-core",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
verifiers = [
  "verifiers @ git+https://github.com/machine-exploration/verifiers@e66ec52966327e79011f4c3bb34a0f9817ce32b8",
]

[tool.uv.sources]
explorers-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorers"]

[tool.hatch.metadata]
allow-direct-references = true
