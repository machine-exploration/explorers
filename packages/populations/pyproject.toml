[project]
name = "explorers-populations"
version = "0.1.0.dev0"
description = "Populations on explorers: scenarios, a runtime and observables for many agents across turns."
requires-python = ">=3.11"
dependencies = [
  "explorers-core",
]

[tool.uv.sources]
explorers-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorers"]
