[project]
name = "explorers-learning"
version = "0.1.0.dev0"
description = "Learning mechanics on explorers: checkpoint suites, toy settings, probes and studies of single models across training."
requires-python = ">=3.11"
dependencies = [
  "explorers-core",
  "numpy>=1.26",
]

[project.optional-dependencies]
hf = ["explorers-core[torch]"]

[project.scripts]
explorers-learning = "explorers.learning.cli:main"

[tool.uv.sources]
explorers-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorers"]
