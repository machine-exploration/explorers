[project]
name = "explorers-core"
version = "0.1.0.dev0"
description = "Primitives for measuring models over time: examples, states, observables, an engine and a content-addressed store."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "xarray>=2024.1",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "transformers>=4.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorers"]
